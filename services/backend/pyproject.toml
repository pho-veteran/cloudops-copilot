[project]
name = "cloudops-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn==0.38.0",
  "pydantic==2.12.3",
  "sqlalchemy==2.0.44",
  "alembic==1.17.0",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.14.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops"]

[tool.pytest.ini_options]
testpaths = ["tests_unit", "tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
