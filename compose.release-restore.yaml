# Point a disposable release-lab project at its owned restore database and add the trusted
# restored-work cleanup service. Use after compose.release.yaml and compose.release-lab.yaml.
# Every application, executor and cleanup connection uses cloudops_restore_test only.
x-restore-url: &restore-url postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudops_restore_test

services:
  db:
    environment:
      POSTGRES_DB: cloudops_restore_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudops -d cloudops_restore_test']
  migrate:
    environment:
      DATABASE_URL: *restore-url
  api:
    environment:
      DATABASE_URL: *restore-url
  worker:
    environment:
      DATABASE_URL: *restore-url
  observer:
    environment:
      DATABASE_URL: *restore-url
  executor:
    environment:
      DATABASE_URL: *restore-url
  # Trusted host-side cleanup after a database restore. Requires the host dispatch permit in
  # recovery with every class denied and every executor target closed in recovery.
  # Usage: docker compose ... run --rm restore-admin cloudops.entrypoints.recovery_restore
  #        docker compose ... run --rm restore-admin cloudops.entrypoints.diagnosis_recovery
  restore-admin:
    image: ${RELEASE_BACKEND_IMAGE:?Use the release bundle images.env}
    pull_policy: never
    platform: linux/amd64
    profiles: [restore-admin]
    entrypoint: [python, -m]
    command: [cloudops.entrypoints.recovery_restore]
    environment:
      DATABASE_URL: *restore-url
      WEB_ORIGIN: https://localhost:8443
      COOKIE_SECURE: "true"
      JOB_DISPATCH_ROOT: /run/cloudops-job-permit
      EXECUTOR_ROOT: /var/lib/cloudops-executor
    volumes:
      - job_dispatch:/run/cloudops-job-permit:ro
      - executor_authority:/var/lib/cloudops-executor:ro
    depends_on:
      db:
        condition: service_healthy
