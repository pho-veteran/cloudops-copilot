services:
  migrate:
    environment: &https-env
      WEB_ORIGIN: https://localhost:8443
      COOKIE_SECURE: "true"
  api:
    environment: *https-env
    ports: !reset []
  worker:
    environment: *https-env
  web:
    profiles: [http-development]
  https:
    image: cloudops-local-https
    build:
      context: .
      dockerfile: apps/web/Dockerfile.https
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - local_https_data:/data
      - local_https_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'test -s /data/caddy/pki/authorities/local/root.crt']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  local_https_data:
  local_https_config:
