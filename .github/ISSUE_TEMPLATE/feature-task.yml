name: Feature task
description: Define a cohesive implementation slice after its owning EPIC starts.
title: "feat(area): "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for a started EPIC. Keep research and future scope in the
        existing feature EPIC; do not generate the complete backlog in advance.
        Write authored content in English and preserve quoted evidence as supplied.
  - type: input
    id: parent
    attributes:
      label: Owning EPIC
      description: Link the existing EPIC and its relevant acceptance or foundation deliverable.
      placeholder: "https://github.com/pho-veteran/cloudops-copilot/issues/..."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and current baseline
      description: Explain the current behavior, intended result and inspected commit.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and approach
      description: Name owned modules, existing code to reuse and affected contracts.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Expected output and acceptance
      description: Describe observable behavior under a concrete trigger, including relevant failure paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and completion
      description: Identify focused checks, fixture versus live proof, and applicable documentation or migration checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and integration
      description: Link prerequisite deliverables and affected consumers. State None only after checking; avoid unnecessary whole-EPIC blockers.
    validations:
      required: true
