# Trusted post-restore cleanup for a release installation with the scoped writer topology.
# Use after compose.release.yaml, compose.integration.yaml and compose.release-lab.yaml.
# Requires the host dispatch permit in recovery with every class denied and every executor
# target closed in recovery. Usage:
#   docker compose ... run --rm --no-deps restore-admin
#   docker compose ... run --rm --no-deps restore-admin cloudops.entrypoints.diagnosis_recovery
services:
  restore-admin:
    image: ${RELEASE_BACKEND_IMAGE:?Use the release bundle images.env}
    pull_policy: never
    platform: linux/amd64
    profiles: [restore-admin]
    entrypoint: [python, -m]
    command: [cloudops.entrypoints.recovery_restore]
    environment:
      DATABASE_URL: postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudops
      WEB_ORIGIN: https://localhost:8443
      COOKIE_SECURE: "true"
      JOB_DISPATCH_ROOT: /run/cloudops-job-permit
      EXECUTOR_ROOT: /var/lib/cloudops-executor
    volumes:
      - job_dispatch:/run/cloudops-job-permit:ro
      - executor_authority:/var/lib/cloudops-executor:ro
    depends_on:
      db:
        condition: service_healthy
