# Second healthy writer target for restore qualification only. It is configured in the
# executor allowlist with no application execution history, and the writer may patch it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-standby
  namespace: demo
  labels: {app: checkout-standby}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-standby}
  template:
    metadata:
      labels: {app: checkout-standby}
    spec:
      containers:
        - name: checkout
          image: python:3.13.11-slim-bookworm
          command: [python, -m, http.server, "8080"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cloudops-writer-standby, namespace: demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [checkout-standby]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-writer-standby, namespace: demo}
subjects: [{kind: ServiceAccount, name: cloudops-writer, namespace: demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-writer-standby}
