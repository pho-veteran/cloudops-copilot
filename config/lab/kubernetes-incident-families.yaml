# Live incident fixtures for the owned K3s acceptance lab (issue #47).
# Apply after config/lab/workload.yaml; the collector is scoped per Deployment UID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-crashloop
  namespace: demo
  labels: {app: checkout-crashloop}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-crashloop}
  template:
    metadata:
      labels: {app: checkout-crashloop}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "startup failed: config missing"; sleep 1; exit 1'
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-oom
  namespace: demo
  labels: {app: checkout-oom}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-oom}
  template:
    metadata:
      labels: {app: checkout-oom}
    spec:
      containers:
        - name: app
          image: polinux/stress:1.0.4
          command: [stress, --vm, "1", --vm-bytes, 80M, --vm-hang, "1"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-pending
  namespace: demo
  labels: {app: checkout-pending}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-pending}
  template:
    metadata:
      labels: {app: checkout-pending}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sleep, "3600"]
          resources:
            requests: {cpu: "100", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-imagepull
  namespace: demo
  labels: {app: checkout-imagepull}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-imagepull}
  template:
    metadata:
      labels: {app: checkout-imagepull}
    spec:
      containers:
        - name: app
          image: busybox:cloudops-missing-tag-xyz
          command: [sleep, "3600"]
