# Bounded log-cap fixture for the owned K3s acceptance lab (issue #47).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-noisy
  namespace: demo
  labels: {app: checkout-noisy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-noisy}
  template:
    metadata:
      labels: {app: checkout-noisy}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'i=1; while [ $i -le 300 ]; do echo "line $i"; i=$((i+1)); done; while true; do echo "line $i"; i=$((i+1)); sleep 1; done'
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
