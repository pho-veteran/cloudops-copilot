apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  - level: Metadata
    resources:
      - group: ''
        resources: [secrets]
  - level: RequestResponse
    namespaces: [demo]
    verbs: [create, update, patch, delete, deletecollection]
    resources:
      - group: apps
        resources: [deployments, deployments/scale]
  - level: Metadata
    verbs: [create, update, patch, delete, deletecollection]
  - level: None
