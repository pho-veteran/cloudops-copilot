global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [https:9093]
scrape_configs:
  - job_name: lab-offered-load
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: [load:8090]
  - job_name: sample
    kubernetes_sd_configs:
      - role: pod
        api_server: https://k3s:6443
        namespaces: {names: [demo]}
        authorization: {credentials_file: /run/monitoring/token}
        tls_config: {ca_file: /run/monitoring/ca.crt}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_cloudops_lab_workload_uid]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_uid]
        target_label: pod_uid
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: deployment
      - source_labels: [__meta_kubernetes_pod_label_cloudops_lab_workload_uid]
        target_label: deployment_uid
  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: pod
        api_server: https://k3s:6443
        namespaces: {names: [cloudops-lab-monitoring]}
        authorization: {credentials_file: /run/monitoring/token}
        tls_config: {ca_file: /run/monitoring/ca.crt}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        regex: kube-state-metrics;metrics
        action: keep
  - job_name: kubelet
    scheme: https
    authorization: {credentials_file: /run/monitoring/token}
    tls_config: {ca_file: /run/monitoring/ca.crt, server_name: cloudops-local}
    metrics_path: /metrics/cadvisor
    static_configs:
      - targets: [cloudops-local:10250]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
        action: keep
      - source_labels: [namespace]
        regex: demo
        action: keep
      - source_labels: [id]
        regex: '.*pod([0-9a-f]{8})[_-]([0-9a-f]{4})[_-]([0-9a-f]{4})[_-]([0-9a-f]{4})[_-]([0-9a-f]{12}).*'
        replacement: '$1-$2-$3-$4-$5'
        target_label: pod_uid
      - source_labels: [pod_uid]
        regex: .+
        action: keep
