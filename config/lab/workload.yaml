apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
  labels: {app: checkout}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: checkout
          image: python:3.13.11-slim-bookworm
          command: [python, -m, http.server, "8080"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudops-reader, namespace: demo}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudops-writer, namespace: demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cloudops-reader, namespace: demo}
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services, events, replicationcontrollers]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-reader, namespace: demo}
subjects: [{kind: ServiceAccount, name: cloudops-reader, namespace: demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cloudops-capacity-reader}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cloudops-capacity-reader}
subjects: [{kind: ServiceAccount, name: cloudops-reader, namespace: demo}, {kind: ServiceAccount, name: cloudops-writer, namespace: demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cloudops-capacity-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cloudops-writer, namespace: demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [checkout]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-writer, namespace: demo}
subjects: [{kind: ServiceAccount, name: cloudops-writer, namespace: demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-writer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-writer-observation, namespace: demo}
subjects: [{kind: ServiceAccount, name: cloudops-writer, namespace: demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-reader}
