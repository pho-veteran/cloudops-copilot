# Restore drills of the core-only release package (no executor): point a disposable core
# project at its owned restore database. Use after compose.yaml, compose.https.yaml and
# compose.release.yaml. Every connection uses cloudops_restore_test.
x-restore-url: &restore-url postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudops_restore_test

services:
  db:
    environment:
      POSTGRES_DB: cloudops_restore_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudops -d cloudops_restore_test']
  migrate:
    environment:
      DATABASE_URL: *restore-url
  api:
    environment:
      DATABASE_URL: *restore-url
  worker:
    environment:
      DATABASE_URL: *restore-url
  observer:
    environment:
      DATABASE_URL: *restore-url
  # Never point destructive pytest runs at the drill database.
  test:
    environment:
      DATABASE_URL: *restore-url
      TEST_DATABASE_URL: postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudops_restore_checks_test
