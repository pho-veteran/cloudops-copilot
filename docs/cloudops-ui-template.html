<style>
#cloudops-preview{color-scheme:light dark;--co-bg:light-dark(#f4f6f9,#111923);--co-panel:light-dark(#ffffff,#192431);--co-ink:light-dark(#172638,#e8eef5);--co-soft:light-dark(#59697a,#b0becd);--co-line:light-dark(#dce3ea,#344352);--co-navy:light-dark(#142c44,#0b1420);--co-teal:light-dark(#086f68,#66d2c6);--co-on:light-dark(#ffffff,#102824);--co-warn:light-dark(#92440f,#ffc38e);--co-wash:light-dark(#fff2e6,#38291f);--co-active:light-dark(#e3f4f1,#173b3b);font:14px/1.55 system-ui,sans-serif;color:var(--co-ink);background:var(--co-bg);border:1px solid var(--co-line);border-radius:14px;overflow-wrap:anywhere}
#cloudops-preview *{box-sizing:border-box}#cloudops-preview button,#cloudops-preview input,#cloudops-preview select,#cloudops-preview textarea{font:inherit}#cloudops-preview button{min-height:38px;border:1px solid var(--co-line);border-radius:7px;padding:7px 12px;color:var(--co-ink);background:var(--co-panel)}#cloudops-preview button:disabled{opacity:.55;cursor:not-allowed}#cloudops-preview button.co-primary{background:var(--co-teal);color:var(--co-on);border-color:var(--co-teal)}#cloudops-preview button.co-selected{background:var(--co-active);color:var(--co-teal);border-color:var(--co-teal)}#cloudops-preview :focus-visible{outline:3px solid var(--co-teal);outline-offset:3px}#cloudops-preview input,#cloudops-preview select,#cloudops-preview textarea{width:100%;min-width:0;padding:9px;border:1px solid var(--co-line);border-radius:7px;color:var(--co-ink);background:var(--co-panel)}#cloudops-preview textarea{min-height:95px;resize:vertical}#cloudops-preview label{display:grid;gap:5px;color:var(--co-soft)}#cloudops-preview h1{font-size:25px;line-height:1.25;font-weight:500;margin:0 0 7px}#cloudops-preview h2{font-size:19px;font-weight:500;margin:0 0 12px}#cloudops-preview h3{font-size:15px;font-weight:500;margin:0 0 8px}#cloudops-preview p{margin:7px 0 12px}#cloudops-preview small,#cloudops-preview .co-subtle{color:var(--co-soft)}#cloudops-preview .co-preview-bar{padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--co-line)}#cloudops-preview .co-preview-bar label{display:flex;align-items:center;gap:8px}#cloudops-preview .co-preview-bar select{width:auto;max-width:100%}#cloudops-preview .co-demo{font-size:12px;letter-spacing:.08em;font-weight:500;color:var(--co-warn)}#cloudops-preview .co-shell{display:grid;grid-template-columns:180px minmax(0,1fr)}#cloudops-preview aside.co-nav{padding:24px 13px;background:var(--co-navy);color:#edf5fc;border-radius:0 0 0 13px}#cloudops-preview .co-brand{font-size:19px;font-weight:500;margin:0 8px 3px}#cloudops-preview .co-brand-sub{font-size:12px;color:#b5c6d7;margin:0 8px 30px}#cloudops-preview .co-nav button{width:100%;text-align:left;border:0;color:#d5e2ee;background:transparent;margin:3px 0}#cloudops-preview .co-nav button.co-selected{background:#25485d;color:#ffffff}#cloudops-preview .co-nav-bottom{border-top:1px solid #3a5065;margin-top:38px;padding:15px 8px;font-size:12px;color:#b5c6d7}#cloudops-preview main{min-width:0;padding:22px}#cloudops-preview .co-topline,#cloudops-preview .co-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#cloudops-preview .co-topline{justify-content:space-between;margin-bottom:24px}#cloudops-preview .co-row.co-spread{justify-content:space-between}#cloudops-preview .co-stack{display:grid;gap:15px}#cloudops-preview .co-panel{background:var(--co-panel);border:1px solid var(--co-line);border-radius:10px;padding:18px;min-width:0}#cloudops-preview .co-toolbar{display:grid;grid-template-columns:minmax(100px,1fr) minmax(120px,180px) auto;gap:10px;margin:18px 0}#cloudops-preview .co-incident{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:17px 0;border-bottom:1px solid var(--co-line)}#cloudops-preview .co-incident:last-child{border:0}#cloudops-preview .co-incident button.co-title{padding:0;border:0;background:transparent;text-align:left;color:var(--co-teal);font-weight:500;min-height:30px}#cloudops-preview .co-badge{display:inline-block;border-radius:5px;padding:3px 7px;background:var(--co-active);color:var(--co-teal);font-size:12px}#cloudops-preview .co-badge.co-warn{background:var(--co-wash);color:var(--co-warn)}#cloudops-preview .co-workspace{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px;align-items:start}#cloudops-preview .co-tabs{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--co-line);padding-bottom:12px;margin:18px 0}#cloudops-preview .co-tabs button{border:0;background:transparent}#cloudops-preview .co-tabs button.co-selected{background:var(--co-active)}#cloudops-preview .co-callout{border-left:3px solid var(--co-teal);padding:10px 13px;background:var(--co-active);margin:12px 0}#cloudops-preview .co-callout.co-warn{border-color:var(--co-warn);background:var(--co-wash)}#cloudops-preview .co-keyline{border-top:1px solid var(--co-line);padding-top:13px;margin-top:13px}#cloudops-preview code,#cloudops-preview pre{font:12px/1.6 ui-monospace,monospace}#cloudops-preview pre{white-space:pre-wrap;background:var(--co-bg);padding:12px;border-radius:7px;overflow-wrap:anywhere}#cloudops-preview .co-timeline{padding-left:18px;border-left:2px solid var(--co-line)}#cloudops-preview .co-timeline p{margin-bottom:18px}#cloudops-preview .co-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}#cloudops-preview .co-full{grid-column:1/-1}#cloudops-preview .co-notice{color:var(--co-teal);min-height:24px;margin-top:10px}#cloudops-preview .co-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}#cloudops-preview .co-modal{background:var(--co-panel);border:2px solid var(--co-teal);border-radius:10px;padding:22px;margin:18px 0;box-shadow:0 8px 26px light-dark(#142c4418,#00000040)}#cloudops-preview .co-hidden{display:none}#cloudops-preview .co-table-wrap{overflow-x:auto}#cloudops-preview table{border-collapse:collapse;width:100%;text-align:left}#cloudops-preview td,#cloudops-preview th{padding:12px 8px;border-bottom:1px solid var(--co-line);vertical-align:top;font-weight:400}#cloudops-preview th{color:var(--co-soft)}#cloudops-preview .co-evidence-link{color:var(--co-teal);text-decoration:underline}#cloudops-preview .co-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--co-soft);margin-bottom:8px}
@media(max-width:850px){#cloudops-preview .co-shell{grid-template-columns:1fr}#cloudops-preview aside.co-nav{border-radius:0;padding:15px}#cloudops-preview .co-brand-sub,#cloudops-preview .co-nav-bottom{display:none}#cloudops-preview .co-nav nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}#cloudops-preview .co-nav button{width:auto}#cloudops-preview .co-workspace{grid-template-columns:minmax(0,1fr) 260px}#cloudops-preview main{padding:18px}}
@media(max-width:620px){#cloudops-preview .co-workspace,#cloudops-preview .co-fields,#cloudops-preview .co-compare,#cloudops-preview .co-toolbar{grid-template-columns:1fr}#cloudops-preview .co-incident{grid-template-columns:1fr}#cloudops-preview main{padding:14px}#cloudops-preview .co-panel{padding:14px}#cloudops-preview .co-topline{margin-bottom:16px}#cloudops-preview .co-preview-bar{padding:12px}#cloudops-preview .co-preview-bar label{display:grid;width:100%}#cloudops-preview .co-preview-bar select{width:100%}#cloudops-preview button{min-height:44px}#cloudops-preview input,#cloudops-preview select,#cloudops-preview textarea{font-size:16px}}
#cloudops-preview .co-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin:18px 0}#cloudops-preview .co-metric{min-width:0;margin:0}#cloudops-preview .co-metric figcaption{font-weight:500;margin-bottom:4px}#cloudops-preview .co-metric svg{display:block;width:100%;height:185px}#cloudops-preview .co-metric svg text{font:12px system-ui,sans-serif;fill:var(--co-ink)}#cloudops-preview .co-metric small{display:block}#cloudops-preview .co-metric-missing{padding:14px 0;border-block:1px solid var(--co-line)}
</style>
<div class="co-preview-bar"><span class="co-demo">INTERACTIVE DEMO · ALL DATA SIMULATED</span><label>Preview scenario <select id="co-scenario"><option value="oom">OOM · ready for review</option><option value="insufficient">Insufficient evidence</option><option value="quota">Provider quota exhausted</option><option value="stale">Stale plan</option><option value="failed">Failed verification</option><option value="viewer">Viewer access</option><option value="loading">Loading</option><option value="empty">Empty queue</option><option value="error">Connection error</option></select></label><button data-act="reset">Reset demo</button></div>
<div class="co-shell"><aside class="co-nav"><div class="co-brand">◈ CloudOps</div><div class="co-brand-sub">Evidence into decisions</div><nav aria-label="Main navigation"><button data-nav="queue" class="co-selected">Work queue</button><button data-nav="workloads">Workloads</button><button data-nav="knowledge">Knowledge</button><button data-nav="connections">Connections</button></nav><div class="co-nav-bottom">LAB ENVIRONMENT<br>k3s · us-east-1<br><br>Scoped to cloudops-lab<br>Deployment workloads</div></aside><main><div class="co-topline"><span class="co-subtle">Lab / cloudops-lab</span><div class="co-row"><span id="co-identity">Alex · Operator</span><button data-act="account">Switch account</button></div></div><div id="co-content"></div><div id="co-message" class="co-notice" role="status" aria-live="polite"></div></main></div>
<script>
(()=>{
const root=document.getElementById('cloudops-preview'),out=root.querySelector('#co-content'),msg=root.querySelector('#co-message');
const records=[{id:'INC-042',name:'checkout-api',pattern:'OOM',title:'Checkout restarts under steady load',state:'Awaiting approval',impact:'2 restarts · one replica unavailable',evidence:'OOMKilled · memory reached 256 MiB limit',action:'set_memory_profile',diff:'memory limit: 256Mi → 512Mi\nmemory request: 128Mi → 256Mi'},{id:'INC-041',name:'catalog-api',pattern:'CrashLoop',title:'Startup failure after configuration change',state:'Open',impact:'Deployment rollout unavailable',evidence:'Previous log: missing required APP_MODE · revision 18',action:'restore_deployment_template',diff:'template revision: 18 → known-good 17\nAPP_MODE: empty → production'},{id:'INC-040',name:'search-api',pattern:'Load',title:'Latency rises during traffic increase',state:'Open',impact:'p95 820 ms during controlled load',evidence:'RPS increased · CPU throttling · node headroom available',action:'scale_deployment',diff:'replicas: 1 → 3\nallowed bounds: 1–3'},{id:'INC-039',name:'worker-api',pattern:'Pending',title:'Replica cannot be scheduled',state:'Manual guidance',impact:'1 replica Pending',evidence:'FailedScheduling: insufficient memory',action:null},{id:'INC-038',name:'media-api',pattern:'ImagePull',title:'New image cannot be pulled',state:'Manual guidance',impact:'Rollout blocked · old replica still Ready',evidence:'ImagePullBackOff · manifest unknown',action:null}];
let s={page:'queue',tab:'Findings',selected:0,role:'operator',scenario:'oom',status:'awaiting_approval',resolved:false,ack:false,notes:[],filter:'all',search:'',modal:'',worktab:'Inventory',run:2,reason:''};
let incidentStates={};
function incidentState(i=s.selected){return incidentStates[i]||(incidentStates[i]={status:records[i].action?'awaiting_approval':'manual_guidance',resolved:false,ack:false,notes:[],run:2,scenario:'oom',compareRun:1,runs:[{id:1,scenario:'insufficient',summary:'Cause undetermined: previous termination and metric evidence missing.',evidence:['Deployment status'],window:'Last 30 minutes',symptom:records[i].pattern,question:'Initial investigation',actionStatus:'not_created'},{id:2,scenario:'oom',summary:records[i].evidence,evidence:['E-101','E-102'],window:'Last 30 minutes',symptom:records[i].pattern,question:'Investigate observed workload symptoms',actionStatus:records[i].action?'awaiting_approval':'manual_guidance'}]})}
['status','resolved','ack','notes','run','scenario','compareRun','runs'].forEach(key=>Object.defineProperty(s,key,{get:()=>incidentState()[key],set:value=>{incidentState()[key]=value},enumerable:true,configurable:true}));
function activeExecution(){return ['executing','verifying','uncertain'].includes(s.status)}
function snapshot(){return s.runs.find(run=>run.id===s.run)}
function startRun(reason,meta={}){if(activeExecution()){announce('Wait for execution and verification to finish before investigating again.');return false}const prior=snapshot();if(prior)prior.actionStatus=['awaiting_approval','approved'].includes(s.status)?'stale':s.status;s.run++;s.runs.push({id:s.run,scenario:'oom',summary:records[s.selected].evidence,evidence:['E-101','E-102'],window:meta.window||'Last 30 minutes',symptom:meta.symptom||records[s.selected].pattern,question:meta.question||reason,actionStatus:records[s.selected].action?'awaiting_approval':'manual_guidance'});s.scenario='oom';s.status=records[s.selected].action?'awaiting_approval':'manual_guidance';s.compareRun=s.runs[s.runs.length-2].id;s.notes.push('Run '+s.run+': '+reason);return true}
function displayedState(index){const state=incidentState(index);return state.resolved?'Resolved':state.scenario==='quota'?'Waiting for quota':state.scenario==='insufficient'?'Insufficient evidence':({awaiting_approval:'Awaiting approval',executing:'Executing',verifying:'Verifying',succeeded:'Succeeded',failed:'Manual intervention',stale:'Stale plan',rejected:'Rejected',manual_guidance:'Manual guidance'})[state.status]||'Open'}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,act,primary=false,disabled=false)=>`<button data-act="${act}" ${primary?'class="co-primary"':''} ${disabled?'disabled':''}>${label}</button>`;
const badge=(t,w=false)=>`<span class="co-badge ${w?'co-warn':''}">${esc(t)}</span>`;
function announce(t){msg.textContent=t}function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:s.page,scenario:s.scenario,role:s.role},privateContent:null}).catch(()=>{})}
function header(title,desc,action=''){return `<div class="co-row co-spread"><div><h1>${title}</h1><span class="co-subtle">${desc}</span></div>${action}</div>`}
function account(){return `<section class="co-panel"><h1>Demo sign in</h1><p>Choose a sample identity. No credentials are collected.</p><form id="co-login"><label>Sample account<select name="identity"><option value="operator">Alex · Operator</option><option value="viewer">Sam · Viewer</option></select></label><p class="co-subtle">Operators investigate, add notes, manage incidents and review plans. Viewers read and export.</p><div class="co-row"><button class="co-primary" type="button" data-co-submit="true">Enter demo workspace</button>${button('Back','close')}</div></form></section>`}
function queue(){if(s.scenario==='loading')return header('Work queue','Loading preview')+`<div class="co-panel"><h2>Collecting incident list…</h2><p role="status">Connecting to CloudOps API. Your filters will be preserved.</p>${button('Finish loading simulation','loaded',true)}</div>`;if(s.scenario==='error')return header('Work queue','Connection error preview')+`<div class="co-panel"><h2>Work queue could not be loaded</h2><p>The simulated API did not respond. Existing incident data has not been changed.</p>${button('Retry simulation','loaded',true)}</div>`;
const list=s.scenario==='empty'?[]:records.filter(r=>(r.title+' '+r.name+' '+r.pattern).toLowerCase().includes(s.search.toLowerCase())&&(s.filter==='all'||s.filter==='approval'&&displayedState(records.indexOf(r))==='Awaiting approval'||s.filter==='manual'&&!r.action));
return header('Work queue','Investigate, decide and verify in one place.',button('Start investigation','manual',true,s.role==='viewer'))+`<div class="co-toolbar"><label>Search incidents<input id="co-search" value="${esc(s.search)}" placeholder="Workload, symptom or incident"></label><label>Show<select id="co-filter"><option value="all" ${s.filter==='all'?'selected':''}>All incidents</option><option value="approval" ${s.filter==='approval'?'selected':''}>Awaiting approval</option><option value="manual" ${s.filter==='manual'?'selected':''}>Manual guidance</option></select></label><span class="co-subtle">${list.length} demo incidents</span></div><section class="co-panel">${list.length?list.map(r=>`<article class="co-incident"><div><div class="co-eyebrow">${r.id} · ${r.pattern}</div><button class="co-title" data-open="${records.indexOf(r)}">${r.title}</button><div>${r.name} <span class="co-subtle">· ${r.impact}</span></div><small>Snapshot · 21 Oct 2026, 10:42 UTC+7</small></div><div>${badge(displayedState(records.indexOf(r)),!!r.action)}</div></article>`).join(''):`<h2>No incidents to show</h2><p class="co-subtle">${s.scenario==='empty'?'No open incidents in this demo scenario. Start a scoped investigation.':'Try another workload or clear your filters.'}</p>${button('Clear filters','clear')}`}</section>`}
function manual(){return header('Start investigation','A question within one workload; a new evidence snapshot.')+`<section class="co-panel"><form id="co-manual" class="co-fields"><label>Namespace<select name="namespace"><option>cloudops-lab</option></select></label><label>Deployment<select name="workload">${records.map((r,i)=>`<option value="${i}" ${i===(s.manualWorkload||0)?'selected':''}>${r.name}</option>`).join('')}</select></label><label>Time window<select name="window"><option>Last 30 minutes</option><option>Last 1 hour</option><option>Last 6 hours</option></select></label><label>Symptom<select name="symptom"><option>Restarts / OOM</option><option>Startup failure</option><option>Latency / errors</option><option>Pending</option><option>Image pull failure</option></select></label><label class="co-full">Question<textarea name="question" required placeholder="What changed before the restarts? Do we have evidence of a memory limit issue?"></textarea></label><div class="co-full co-callout">Scope: read-only evidence for this Deployment. No terminal or arbitrary cluster commands.</div><div class="co-full co-row"><button type="button" data-co-submit="true" class="co-primary">Create demo investigation</button>${button('Cancel','back')}</div></form></section>`}
function findings(r){if(s.scenario==='quota')return `<h2>Analysis waiting for quota</h2><div class="co-callout co-warn">The configured model endpoint returned a simulated 429. No finding has been generated for this attempt.</div><p>Evidence capture and keyword runbook search remain available. No paid provider fallback.</p><p><strong>Still available:</strong> workload status, events, notes and handoff export.</p>${button('Retry analysis simulation','retry',true,s.role==='viewer')} ${button('View evidence','evidence')}`;
if(s.scenario==='insufficient')return `<h2>Insufficient evidence</h2><div class="co-callout co-warn">A memory-limit cause cannot be established from the available snapshot.</div><h3>Not checked / missing evidence</h3><p>Previous container termination state and memory metrics for the restart window. No hypothesis was ruled out from these missing sources.</p><h3>Next checks</h3><p>Restore telemetry coverage, capture previous logs, then investigate again. No action plan is available.</p>${button('Re-investigate','reinvestigate',true,s.role==='viewer')}`;
return `<div class="co-eyebrow">Investigation run ${s.run} · completed · snapshot evidence</div><h2>${r.pattern==='OOM'?'Memory limit is consistent with observed restarts':r.title}</h2><div class="co-callout">${r.evidence}. ${r.pattern==='OOM'?'This supports a limit-related OOM; it does not establish whether an application leak exists.':'Conclusion is limited to the observed snapshot.'}</div><h3>Supporting evidence</h3><p><button class="co-evidence-link" data-act="evidence">E-101 · ${r.evidence}</button></p><p><button class="co-evidence-link" data-act="evidence">E-102 · Deployment status and change window</button></p><h3>Alternatives checked</h3><p>No alternative is marked ruled out in this demo snapshot. A negative finding requires supporting evidence and adequate coverage.</p><h3>Not checked & limitations</h3><p class="co-subtle">${r.pattern==='OOM'?'A memory leak or a change in traffic may also increase usage. The captured 15-minute window cannot establish long-term behavior.':'Events identify the symptom; application-level and infrastructure causes outside this scope require manual investigation.'}</p><h3>Runbook used</h3><p><button data-act="runbook">${r.pattern} response · version 3</button> <small>Metadata + full-text retrieval</small></p>`}
function metricDefinitions(r){if(r.pattern==='Load')return [{name:'Request rate',unit:'requests/s',values:[40,90,160,180],source:'DEMO Prometheus fixture · http_requests_total rate'},{name:'Request latency · p95',unit:'ms',values:[110,180,560,820],source:'DEMO Prometheus fixture · request_duration_seconds p95'}];if(r.pattern==='CrashLoop')return [{name:'Container restarts',unit:'count',values:[0,2,4,6],source:'DEMO Prometheus fixture · restarts_total'},{name:'Ready replicas',unit:'replicas',values:[1,1,0,0],source:'DEMO kube-state-metrics fixture · replicas_available'}];return [{name:'Container memory vs limit',unit:'MiB',values:[170,215,255,180],limit:256,source:'DEMO Prometheus fixture · working_set_bytes / 2²⁰; limit from config'},{name:'Container restarts',unit:'count',values:[0,0,1,2],source:'DEMO Prometheus fixture · restarts_total'}]}
function metricCharts(r){if(['Pending','ImagePull'].includes(r.pattern))return '<p class="co-subtle">No metric series attached to this diagnostic fixture; the scheduling or image event is the primary evidence.</p>';const definitions=metricDefinitions(r);if(s.scenario==='insufficient')return `<div class="co-metrics">${definitions.map(d=>`<section class="co-metric-missing"><h3>${d.name}</h3>${badge('No data',true)}<p class="co-subtle">Series unavailable for this snapshot. No values, zero baseline or trend inferred.</p></section>`).join('')}</div>`;return `<div class="co-metrics">${definitions.map((d,i)=>`<figure class="co-metric"><figcaption>${d.name} · DEMO</figcaption><svg data-co-metric="${i}" role="img" aria-label="Demo ${d.name}: ${d.values.join(', ')} ${d.unit}${d.limit?'; limit '+d.limit+' '+d.unit:''}, at 10:30, 10:35, 10:40 and 10:45 UTC+7"></svg><small>${d.source}<br>10:30–10:45 UTC+7 · four illustrative samples · run ${s.run}</small></figure>`).join('')}</div>`}
let metricObserver;
function drawMetrics(){if(metricObserver){metricObserver.disconnect();metricObserver=null}const charts=Array.from(root.querySelectorAll('[data-co-metric]'));if(!charts.length)return;const definitions=metricDefinitions(records[s.selected]);function draw(svg){const d=definitions[+svg.dataset.coMetric],width=Math.floor(svg.getBoundingClientRect().width);if(!d||width<150)return;const left=64,right=width-16,top=31,bottom=134;const observedMax=Math.max(...d.values,d.limit||0);const upper=Math.max(1,Math.ceil(observedMax*1.12)),x=i=>left+(right-left)*i/3,y=v=>bottom-(bottom-top)*v/upper;const ticks=[0,Math.round(upper/2),upper],timeLabels=['10:30','10:35','10:40','10:45'];const shown=width<300?[0,3]:[0,1,2,3];const points=d.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');svg.setAttribute('viewBox',`0 0 ${width} 185`);svg.innerHTML=`<title>DEMO ${d.name}</title><desc>Four illustrative samples, not live measurements. ${d.values.join(', ')} ${d.unit}. Source and time window shown below.</desc><text class="co-axis-title" data-axis="y" x="${left}" y="15">${d.unit}</text><rect data-chart-frame x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="none" stroke="var(--co-line)"/>${ticks.map(v=>`<line x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--co-line)"/><text x="${left-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}${shown.map(i=>`<text x="${x(i)}" y="153" text-anchor="${i===0?'start':i===3?'end':'middle'}">${timeLabels[i]}</text>`).join('')}<text class="co-axis-title" data-axis="x" x="${(left+right)/2}" y="177" text-anchor="middle">Time · UTC+7</text>${d.limit?`<line x1="${left}" x2="${right}" y1="${y(d.limit)}" y2="${y(d.limit)}" stroke="var(--co-soft)" stroke-dasharray="4 3"/><text x="${right-3}" y="${y(d.limit)-7}" text-anchor="end">${d.limit} limit</text>`:''}<polyline points="${points}" fill="none" stroke="var(--co-teal)" stroke-width="2"/>${d.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--co-teal)"/>`).join('')}<text x="${right-3}" y="${y(d.values[3])-9}" text-anchor="end">${d.values[3]}</text>`}charts.forEach(draw);if(globalThis.ResizeObserver){metricObserver=new ResizeObserver(entries=>entries.forEach(entry=>draw(entry.target)));charts.forEach(svg=>metricObserver.observe(svg))}}
function evidence(r){const partial=s.scenario==='insufficient';return `<h2>Evidence snapshot</h2><p class="co-subtle">Requested window: ${esc(snapshot().window)} · collected 10:46 UTC+7 · run ${s.run}. This is demo snapshot data.</p>${metricCharts(r)}<div class="co-timeline"><p><strong>10:30 · Deployment marker</strong><br>Configuration revision recorded before the observation window.</p><p><strong>10:42 · ${partial?'E-100 · Collection gap':'E-101 · Kubernetes event'}</strong><br>${partial?'Previous termination state and metric series unavailable. No OOM event is established.':r.evidence}</p><p><strong>10:43 · E-102 · Workload status</strong><br>${r.impact}</p><p><strong>10:46 · Collection marker</strong><br>Configuration snapshot attached to run ${s.run}.</p></div><details open><summary>Source payload · ${partial?'E-100':'E-101'}</summary><pre>${partial?'lastState.terminated.reason: unavailable\nmemory series: unavailable':r.pattern==='OOM'?'lastState.terminated.reason: OOMKilled\ncontainer: checkout\nlimit: 256Mi\nrestartCount: 2':esc(r.evidence)}\nnamespace: cloudops-lab\nsource: Kubernetes API\nsnapshot: demo-run-${s.run}</pre></details><p class="co-subtle">${partial?'Partial coverage: no conclusion about the missing values.':'Demo series illustrate the evidence view; post-check requires fresh telemetry, configured metric thresholds and adequate coverage. Falling traffic or missing coverage makes recovery inconclusive.'}</p>`}
function activity(){return `<h2>Activity</h2><div class="co-timeline"><p><strong>10:46 · Investigator</strong><br>Run ${s.run} ${s.scenario==='quota'?'waiting for quota':'completed'}; snapshot preserved.</p><p><strong>10:42 · Alertmanager</strong><br>Incident opened and matched to Deployment.</p>${s.ack?'<p><strong>Alex · Acknowledged</strong><br>Operator has taken ownership.</p>':''}${s.notes.map(n=>`<p><strong>Alex · Note</strong><br>${esc(n)}</p>`).join('')}${s.resolved?'<p><strong>Alex · Resolved</strong><br>Resolution reason saved in this demo session.</p>':''}</div><form id="co-note"><label>Add a note<textarea name="note" required ${s.role==='viewer'?'disabled':''}></textarea></label><p><button type="button" data-co-submit="true" ${s.role==='viewer'?'disabled':''}>Save note</button></p></form>`}
function compare(){const earlier=s.runs.filter(run=>run.id!==s.run);const left=earlier.find(run=>run.id===s.compareRun)||earlier[0],right=snapshot();const column=(run,label)=>`<div><h3>Run ${run.id} · ${label}</h3>${badge(run.scenario==='insufficient'?'Insufficient evidence':run.scenario==='quota'?'Waiting for quota':'Completed',run.scenario!=='oom')}<p>${esc(run.summary)}</p><p><small>Evidence: ${esc(run.evidence.join(', '))}<br>Window: ${esc(run.window)}<br>Question: ${esc(run.question)}<br>Symptom: ${esc(run.symptom)}<br>Plan: ${esc(run.actionStatus)}</small></p></div>`;return `<h2>Compare investigation runs</h2><p class="co-subtle">Stored demo snapshots. No additional AI request.</p><label>Earlier run<select id="co-compare">${earlier.map(run=>`<option value="${run.id}" ${run.id===left.id?'selected':''}>Run ${run.id} · ${esc(run.symptom)} · ${esc(run.window)}</option>`).join('')}</select></label><div class="co-compare co-keyline">${column(left,'earlier')}${column(right,'selected')}</div>`}
function next(r){const blocked=s.role==='viewer';let inner='';if(s.resolved)inner=`${badge('Incident resolved')}<h3>No pending decision</h3><p>Unused plans were invalidated on resolution. Reopen and investigate again to create a fresh proposal.</p>${button('Reopen incident','resolve',true,blocked)}`;else if(!r.action||['insufficient','quota'].includes(s.scenario))inner=`${badge('Manual guidance',true)}<h3>Collect or review evidence</h3><p>${!r.action?'This diagnostic pattern has no executable template. Review the source event and follow the scoped runbook.':'A validated finding and applicable template are required before a plan can be created.'}</p><p class="co-subtle">${r.pattern==='Pending'?'Review node capacity, requests and quota. No node or quota writes are offered.':r.pattern==='ImagePull'?'Verify image name/tag and registry access with the registry owner. Secrets are not read.':'Do not infer missing values or approve a guessed change.'}</p>${button('Open runbook','runbook')}`;
else if(s.status==='stale')inner=`${badge('Stale plan',true)}<h3>Target changed after planning</h3><p>Deployment fields no longer match the approved snapshot. This plan cannot execute.</p>${button('Re-investigate','reinvestigate',true,blocked)}`;
else if(s.status==='failed')inner=`${badge('Manual intervention',true)}<h3>Verification failed</h3><p>Rollout did not become Ready within the configured window. Rollback is ineligible because current fields changed.</p><p>Keep evidence and ask the workload owner to inspect the rollout. Incident remains open.</p>${button('Review evidence','evidence',true)}`;
else if(s.status==='executing')inner=`${badge('Executing')}<h3>Applying approved change</h3><p>Plan hash and fresh target checks passed. Execution outcome is not yet known.</p>${button('Advance execution simulation','verify',true)}`;
else if(s.status==='verifying')inner=`${badge('Verifying')}<h3>Checking fresh telemetry</h3><p>Waiting for rollout Ready and no new ${r.pattern==='OOM'?'OOM events':'regression'} in the configured window.</p>${button('Pass verification simulation','success',true)} ${button('Fail verification simulation','fail')}`;
else if(s.status==='succeeded')inner=`${badge('Succeeded')}<h3>Recovery checks passed</h3><p>Fresh rollout and telemetry met this template’s criteria in the demo. Falling traffic or missing telemetry coverage makes recovery inconclusive even when rollout is Ready. Incident resolution is a separate operator decision.</p>${button(s.resolved?'Reopen incident':'Resolve incident','resolve',true,blocked)}`;
else if(s.status==='rejected')inner=`${badge('Rejected',true)}<h3>Plan rejected</h3><p>The decision is recorded. The incident remains open.</p>${button('Re-investigate','reinvestigate',true,blocked)}`;
else inner=`${badge('Awaiting approval',true)}<h3>${r.action.replaceAll('_',' ')}</h3><p><small>Target · ${r.name}<br>Plan P-042 · hash demo-a7c4 · config v3<br>Expires · 21 Oct 2026, 11:15 UTC+7</small></p><pre>${esc(r.diff)}</pre><h3>Prerequisites</h3><p>Target UID and fields match. Capacity within bounds. No conflicting HPA/VPA ownership.</p><h3>Expected outcome</h3><p>Rollout Ready is a deployment check. Recovery requires fresh telemetry, configured metric thresholds and adequate coverage. Falling traffic or missing coverage makes recovery inconclusive. This preview is not a guarantee.</p><h3>Risk & rollback</h3><p>Rollout may interrupt requests. Restore only when template policy and fresh state allow it.</p><div class="co-row">${button('Review & approve','approve',true,blocked)}${button('Reject','reject',false,blocked)}</div>`;
return `<aside class="co-panel"><div class="co-eyebrow">Next step</div>${inner}${blocked?'<div class="co-callout co-warn">Viewer · read-only. Switch to an Operator sample account to make decisions.</div>':''}<div class="co-keyline co-subtle">Every change requires an explicit decision. No backend or cluster is connected.</div></aside>`}
function modal(r){if(!s.modal)return '';if(s.modal==='handoff')return `<section class="co-modal" aria-label="Handoff preview"><h2>Handoff · ${r.id}</h2><p class="co-subtle">Built from stored fields; no AI call. Demo content.</p><textarea id="co-handoff" readonly aria-label="Handoff Markdown"># ${r.id}: ${r.title}\nWorkload: cloudops-lab/${r.name}\nImpact: ${r.impact}\nFinding: ${s.scenario==='quota'?'Analysis waiting for quota':s.scenario==='insufficient'?'Insufficient evidence':r.evidence}\nEvidence: ${esc(snapshot().evidence.join(', '))} (demo snapshot)\nRuled out: no alternative has sufficient exclusion evidence in this demo.\nNot checked: ${s.scenario==='insufficient'?'previous termination state and missing metric series':s.scenario==='quota'?'analysis waiting for provider; hypotheses not assessed':'causes outside the captured window and collection scope'}\nAction: ${r.action||'Manual guidance'}; ${s.status}\nIncident: ${s.resolved?'resolved':'open'}\nOpen question: verify sustained behavior under representative load.</textarea><div class="co-row">${button('Copy text','copy',true)}${button('Close','close')}</div></section>`;
if(s.modal==='runbook')return `<section class="co-modal"><h2>${r.pattern} response · v3</h2><p>Source: repository / runbooks / ${r.pattern.toLowerCase()}.md · demo source</p><ol><li>Confirm resource identity and event timestamps.</li><li>Inspect current/previous state and configuration changes.</li><li>Check coverage, capacity and controller ownership.</li><li>Use a validated template only if prerequisites hold; otherwise hand off.</li></ol>${button('Close runbook','close')}</section>`;

const resolve=s.modal==='resolve',reject=s.modal==='reject';return `<section class="co-modal" aria-label="Confirm decision"><h2>${resolve?(s.resolved?'Reopen incident':'Resolve incident'):reject?'Reject this plan':'Approve this exact plan'}</h2><p>${resolve?'Incident lifecycle is separate from the action outcome. A release resolution preserves the handoff and reason as a snapshot; this demo only records the decision in session state.':reject?'Rejection closes this proposal, not the incident.':`Confirm ${r.action} on cloudops-lab/${r.name}. Plan P-042 / demo-a7c4. Fresh preconditions are checked again before execution.`}</p><form id="co-decision"><label>${resolve||reject?'Reason (required)':'Decision note (optional)'}<textarea name="reason" ${resolve||reject?'required':''}></textarea></label><div class="co-row"><button type="button" data-co-submit="true" class="co-primary">${resolve?'Confirm incident status':reject?'Confirm rejection':'Approve demo plan'}</button>${button('Cancel','close')}</div></form></section>`}
function incident(){const r=records[s.selected];return `<div class="co-row">${button('← Work queue','back')}<span class="co-eyebrow">${r.id} · ${r.pattern}</span></div><div class="co-row co-spread co-keyline"><div><h1>${r.title}</h1><p>${r.name} · ${r.impact}</p><div class="co-row">${badge(s.resolved?'Resolved':s.ack?'Acknowledged':'Open',!s.resolved)}<small>Snapshot 10:46 UTC+7 · ${s.ack?'Alex owns this incident':'Unassigned'}</small></div></div><div class="co-row">${button('Handoff','handoff')}${button(s.ack?'Acknowledged':'Acknowledge','ack',false,s.ack||s.role==='viewer')}${button('Re-investigate','reinvestigate',false,s.role==='viewer'||activeExecution())}${button(s.resolved?'Reopen':'Resolve','resolve',false,s.role==='viewer'||activeExecution())}</div></div>${modal(r)}<div class="co-workspace"><section class="co-panel"><div class="co-tabs" aria-label="Incident sections">${['Findings','Evidence','Activity','Compare'].map(t=>`<button data-tab="${t}" class="${s.tab===t?'co-selected':''}" aria-pressed="${s.tab===t}">${t}</button>`).join('')}</div>${s.tab==='Findings'?findings(r):s.tab==='Evidence'?evidence(r):s.tab==='Activity'?activity():compare()}</section>${next(r)}</div>`}
function workloads(){return header('Workloads','Deployments in the configured scope.',button('Start investigation','manual',true,s.role==='viewer'))+`<div class="co-tabs"><button data-worktab="Inventory" class="${s.worktab==='Inventory'?'co-selected':''}">Inventory</button><button data-worktab="Recommendations" class="${s.worktab==='Recommendations'?'co-selected':''}">Recommendations</button></div>${s.worktab==='Inventory'?`<section class="co-panel">${records.map((r,i)=>`<div class="co-incident"><div><h3>${r.name}</h3><p>${r.impact}</p>${badge(r.pattern,true)}</div><div class="co-row"><button data-detail="${i}">Workload detail</button><button data-open="${i}">Open investigation</button></div></div>`).join('')}<div class="co-incident"><div><h3>payments-api</h3><p>2/2 Ready · no restarts in observed window</p>${badge('Healthy')}</div><button data-detail="healthy">Workload detail</button></div></section>`:`<section class="co-panel"><h2>Resource recommendations</h2><p class="co-subtle">Demo KRR report · requested window 6 hours · 21 Oct 04:00–10:00 UTC+7. Recommendations never auto-apply.</p><div class="co-stack"><div class="co-keyline"><h3>catalog-api ${badge('Available')}</h3><p>CPU request 500m → 250m · observed p95 160m. Coverage 96%; buffer 50%. Limited to this observed lab workload.</p></div><div class="co-keyline"><h3>checkout-api ${badge('Excluded',true)}</h3><p>Recent OOM: no memory reduction proposed. Inspect sustained usage after recovery.</p></div><div class="co-keyline"><h3>worker-api ${badge('Insufficient data',true)}</h3><p>42% coverage with a 2-hour gap. Collect a representative continuous window before recommending.</p></div><div class="co-keyline"><h3>media-api ${badge('Excluded',true)}</h3><p>HPA owns replica scaling. Coordinate controller-managed resources manually.</p></div></div><p>No billing estimate: a sourced rate card is not configured.</p>${button('Preview report export','report')}</section>${s.modal==='report'?`<div class="co-modal"><h2>Repor  else if(f.id==='co-note'){s.notes.push(String(data.get('note')));announce('Note saved in this demo session.')}
 else if(f.id==='co-rerun'){if(!startRun(String(data.get('reason'))))return;s.modal='';s.tab='Findings';announce('New demo run completed; earlier snapshots retained.')}
 else if(f.id==='co-decision'){
  if(activeExecution()){announce('An execution is active; this decision is blocked.');return}
  const action=s.modal;if(['approve','reject'].includes(action)&&(s.resolved||s.status!=='awaiting_approval')){announce('This plan is no longer actionable.');s.modal='';render();return}
  s.notes.push((action==='resolve'?'Incident decision':action==='reject'?'Plan rejection':'Plan approval')+': '+(data.get('reason')||'No note'));
  if(action==='resolve'){if(!s.resolved&&['awaiting_approval','approved'].includes(s.status))s.status='stale';s.resolved=!s.resolved}else s.status=action==='reject'?'rejected':'executing';
  snapshot().actionStatus=s.status;s.modal='';announce('Demo decision recorded. No real action was performed.')
 }render()
}
root.addEventListener('submit',e=>{e.preventDefault();submitForm(e.target)});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const form=e.target.closest('form');if(form){e.preventDefault();if(form.reportValidity())submitForm(form)}}});

})();
