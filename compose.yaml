name: cloudops-local
x-backend: &backend
  image: cloudops-local-backend
  build:
    context: .
    dockerfile: services/backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cloudops
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SESSION_SECONDS: ${SESSION_SECONDS:-28800}
    WORKLOADS_FILE: /workspace/config/development-workloads.json
    COLLECTOR_DELAY_SECONDS: ${COLLECTOR_DELAY_SECONDS:-2}
    COLLECTOR_FAIL: ${COLLECTOR_FAIL:-false}
    COLLECTION_SOURCE_MODE: ${COLLECTION_SOURCE_MODE:-development_fixture}
    # Read-only kubeconfig (server/ca_data/token) for live_kubernetes mode.
    KUBE_READ_CONFIG: ${KUBE_READ_CONFIG:-}
    KUBE_CONFIGMAP_ENABLED: ${KUBE_CONFIGMAP_ENABLED:-0}
    DEFERRED_RUN_LIMIT: ${DEFERRED_RUN_LIMIT:-100}
    # Trusted DispatchPermit/v1 outside PostgreSQL; read-only for api/worker.
    JOB_DISPATCH_ROOT: /run/cloudops-job-permit
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cloudops
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudops -d cloudops']
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [python, -m, cloudops.entrypoints.cli, bootstrap]
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    volumes: [job_dispatch:/run/cloudops-job-permit:ro]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, cloudops.entrypoints.worker]
    volumes: [job_dispatch:/run/cloudops-job-permit:ro]
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Trusted host-side permit administration. No database URL or writer credential.
  # Usage: docker compose run --rm dispatch-admin bootstrap --fresh-install --reason ... --evidence ...
  dispatch-admin:
    image: cloudops-local-backend
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    profiles: [dispatch-admin]
    entrypoint: [python, -m, cloudops.entrypoints.dispatch_admin]
    environment:
      JOB_DISPATCH_ROOT: /run/cloudops-job-permit
    volumes: [job_dispatch:/run/cloudops-job-permit]
  observer:
    <<: *backend
    profiles: [observation]
    command: [python, -m, cloudops.entrypoints.observer]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api:
        condition: service_healthy
  test:
    <<: *backend
    profiles: [checks]
    environment:
      <<: *backend-env
      TEST_DATABASE_URL: postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cloudops_test
    command: [pytest, -q, services/backend/tests_unit, services/backend/tests]
volumes:
  database:
  job_dispatch:
