name: cloudops-local
x-backend: &backend
  build:
    context: .
    dockerfile: services/backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://cloudops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cloudops
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SESSION_SECONDS: ${SESSION_SECONDS:-28800}
    WORKLOADS_FILE: /workspace/config/development-workloads.json
    COLLECTOR_DELAY_SECONDS: ${COLLECTOR_DELAY_SECONDS:-2}
    COLLECTOR_FAIL: ${COLLECTOR_FAIL:-false}
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cloudops
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudops -d cloudops']
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, -c, services/backend/alembic.ini, upgrade, head]
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, cloudops.entrypoints.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
